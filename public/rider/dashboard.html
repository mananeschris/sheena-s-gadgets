<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard | Sheena's Gadgets & Accessories Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #050505;
      --white: #ffffff;
      --muted: #666666;
      --line: #dddddd;
      --soft: #f6f6f6;
      --dark-soft: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .shell {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.72)),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.12), transparent 32%);
      padding: 20px;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 18px;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand span {
      display: block;
      color: #bdbdbd;
      font-size: 0.82rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      font-size: clamp(1.4rem, 4vw, 2.35rem);
      line-height: 1.05;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-light,
    .btn-outline-light {
      border-radius: 8px;
      font-weight: 700;
    }

    .dashboard {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .summary-card {
      padding: 18px;
      border-right: 1px solid var(--line);
      min-height: 92px;
    }

    .summary-card:last-child {
      border-right: 0;
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .summary-card strong {
      display: block;
      font-size: 1.7rem;
      line-height: 1;
    }

    .filters {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 10px;
      background: var(--soft);
    }

    .form-control,
    .form-select {
      border-radius: 8px;
      border-color: #cfcfcf;
      min-height: 44px;
    }

    .content {
      padding: 16px;
    }

    .delivery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .delivery-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--white);
    }

    .delivery-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .order-id {
      display: block;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--ink);
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-assigned {
      background: var(--white);
      color: var(--ink);
    }

    .status-progress {
      background: var(--ink);
      color: var(--white);
    }

    .status-done {
      background: #e9e9e9;
      color: var(--ink);
    }

    .status-issue {
      background: var(--dark-soft);
      color: var(--white);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .info-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--soft);
      min-height: 86px;
    }

    .info-box span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 4px;
    }

    .info-box strong {
      display: block;
      line-height: 1.25;
    }

    .item-list {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .item-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }

    .item-row img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status-actions .btn {
      border-radius: 8px;
      font-weight: 800;
    }

    .empty-state {
      border: 1px dashed #bdbdbd;
      border-radius: 8px;
      padding: 26px;
      text-align: center;
      background: var(--soft);
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
      padding: 30px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .shell {
        padding: 12px;
      }

      .summary,
      .delivery-grid,
      .info-grid,
      .filters {
        grid-template-columns: 1fr;
      }

      .summary-card {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-card:last-child {
        border-bottom: 0;
      }

      .delivery-head {
        display: grid;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/ui-polish.css">
  <link rel="stylesheet" href="/css/ideal-ui.css?v=ideal-ui-20260908f">
</head>
<body class="rider-dashboard-page">
  <div class="shell">
    <header class="topbar">
      <div class="brand brand-with-logo">
        <img class="brand-logo" src="/assets/sheena-mark.svg" alt="Sheena's Gadgets & Accessories Shop logo">
        <span>Sheena's Gadgets & Accessories Shop</span>
        <strong>Rider Dashboard</strong>
        <div id="riderNameText" class="muted text-white-50 mt-2">Loading rider account...</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline-light" onclick="loadAssignments()">Refresh</button>
        <button class="btn btn-light" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="summary">
        <div class="summary-card"><span>Active</span><strong id="summaryActive">0</strong></div>
        <div class="summary-card"><span>Assigned</span><strong id="summaryAssigned">0</strong></div>
        <div class="summary-card"><span>Picked Up</span><strong id="summaryPickedUp">0</strong></div>
        <div class="summary-card"><span>Out for Delivery</span><strong id="summaryOut">0</strong></div>
        <div class="summary-card"><span>Delivered Today</span><strong id="summaryDeliveredToday">0</strong></div>
      </section>

      <section class="filters">
        <input id="deliverySearch" class="form-control" placeholder="Search order, customer, phone, address, or product" oninput="renderAssignments()">
        <select id="deliveryStatusFilter" class="form-select" onchange="renderAssignments()">
          <option value="active">Active deliveries</option>
          <option value="all">All deliveries</option>
          <option value="assigned">Assigned</option>
          <option value="picked_up">Picked Up</option>
          <option value="out_for_delivery">Out for Delivery</option>
          <option value="failed_attempt">Failed Attempt</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </section>

      <section class="content">
        <div id="message" class="loading">Loading deliveries...</div>
        <div id="deliveryGrid" class="delivery-grid"></div>
      </section>
    </main>
  </div>

  <script src="/js/order-reference.js"></script>
  <script>
    const DELIVERY_LABELS = {
      assigned: "Assigned",
      picked_up: "Picked Up",
      out_for_delivery: "Out for Delivery",
      delivered: "Delivered",
      failed_attempt: "Failed Attempt",
      cancelled: "Cancelled"
    };
    const ACTIVE_STATUSES = ["assigned", "picked_up", "out_for_delivery", "failed_attempt"];
    const TRANSITIONS = {
      assigned: [["picked_up", "Picked Up"], ["out_for_delivery", "Out for Delivery"], ["failed_attempt", "Failed Attempt"]],
      picked_up: [["out_for_delivery", "Out for Delivery"], ["delivered", "Delivered"], ["failed_attempt", "Failed Attempt"]],
      out_for_delivery: [["delivered", "Delivered"], ["failed_attempt", "Failed Attempt"]],
      failed_attempt: [["out_for_delivery", "Retry Delivery"]],
      delivered: [],
      cancelled: []
    };

    let currentUser = null;
    let assignments = [];
    let summary = {};

    function readUser() {
      try {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      } catch (error) {
        return null;
      }
    }

    function guardRider() {
      currentUser = readUser();
      if (!currentUser || String(currentUser.role || "").toLowerCase() !== "rider") {
        window.location.href = "/auth.html?returnTo=/rider/dashboard.html";
        return false;
      }
      document.getElementById("riderNameText").innerText = `${currentUser.name || currentUser.email || "Rider"} | Delivery rider`;
      return true;
    }

    function actorPayload() {
      return {
        actor_id: currentUser?.id || null,
        actor_name: currentUser?.name || currentUser?.email || "Rider",
        actor_role: "rider"
      };
    }

    function actorQueryString() {
      return new URLSearchParams(actorPayload()).toString();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function money(value) {
      return "PHP " + Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function statusLabel(status) {
      return DELIVERY_LABELS[status] || status || "Assigned";
    }

    function statusClass(status) {
      if (status === "delivered") return "status-done";
      if (status === "failed_attempt" || status === "cancelled") return "status-issue";
      if (status === "picked_up" || status === "out_for_delivery") return "status-progress";
      return "status-assigned";
    }

    function productImage(item) {
      return item?.product_image || "https://via.placeholder.com/120x120?text=Product";
    }

    function assignmentSearchText(item) {
      const products = Array.isArray(item.items) ? item.items.map(product => `${product.product_name || ""} ${product.variant_name || ""}`).join(" ") : "";
      return [
        orderReference(item.order_id),
        item.customer_display_name,
        item.customer_display_phone,
        item.delivery_display_address,
        item.delivery_note,
        products
      ].join(" ").toLowerCase();
    }

    function filteredAssignments() {
      const search = document.getElementById("deliverySearch").value.toLowerCase();
      const status = document.getElementById("deliveryStatusFilter").value;
      return assignments.filter(item => {
        const matchesStatus = status === "all" ||
          (status === "active" && ACTIVE_STATUSES.includes(item.status)) ||
          item.status === status;
        return matchesStatus && assignmentSearchText(item).includes(search);
      });
    }

    function renderSummary() {
      const fallback = {
        active_count: assignments.filter(item => ACTIVE_STATUSES.includes(item.status)).length,
        assigned_count: assignments.filter(item => item.status === "assigned").length,
        picked_up_count: assignments.filter(item => item.status === "picked_up").length,
        out_for_delivery_count: assignments.filter(item => item.status === "out_for_delivery").length,
        delivered_today_count: assignments.filter(item => item.status === "delivered" && String(item.delivered_at || "").slice(0, 10) === new Date().toISOString().slice(0, 10)).length
      };
      const data = { ...fallback, ...summary };
      document.getElementById("summaryActive").innerText = data.active_count || 0;
      document.getElementById("summaryAssigned").innerText = data.assigned_count || 0;
      document.getElementById("summaryPickedUp").innerText = data.picked_up_count || 0;
      document.getElementById("summaryOut").innerText = data.out_for_delivery_count || 0;
      document.getElementById("summaryDeliveredToday").innerText = data.delivered_today_count || 0;
    }

    function itemRows(item) {
      const items = Array.isArray(item.items) && item.items.length ? item.items : [{
        product_name: item.product_name || "Product",
        variant_name: item.variant_name || "Default",
        quantity: item.quantity || 1,
        product_image: item.product_image
      }];

      return items.map(product => `
        <div class="item-row">
          <img src="${escapeHtml(productImage(product))}" alt="${escapeHtml(product.product_name || "Product")}">
          <div>
            <strong>${escapeHtml(product.product_name || "Product")}</strong>
            <div class="muted">${escapeHtml(product.variant_name || "Default")} | Qty ${product.quantity || 1}</div>
          </div>
        </div>
      `).join("");
    }

    function actionButtons(item) {
      const options = TRANSITIONS[item.status] || [];
      if (!options.length) return `<div class="muted mt-2">No rider action needed.</div>`;
      return `
        <div class="status-actions">
          ${options.map(([status, label]) => `<button class="btn ${status === "delivered" ? "btn-dark" : "btn-outline-dark"} btn-sm" onclick="updateDeliveryStatus(${item.id}, '${status}')">${label}</button>`).join("")}
        </div>
      `;
    }

    function renderAssignments() {
      renderSummary();
      const grid = document.getElementById("deliveryGrid");
      const message = document.getElementById("message");
      const rows = filteredAssignments();
      if (!rows.length) {
        grid.innerHTML = "";
        message.className = "empty-state";
        message.innerText = assignments.length ? "No deliveries match your filters." : "No delivery assignments yet.";
        return;
      }

      message.className = "d-none";
      grid.innerHTML = rows.map(item => `
        <article class="delivery-card">
          <div class="delivery-head">
            <div>
              <span class="order-id">${orderReference(item.order_id)}</span>
              <div class="muted">Assigned ${formatDate(item.assigned_at)}</div>
            </div>
            <span class="status-badge ${statusClass(item.status)}">${escapeHtml(statusLabel(item.status))}</span>
          </div>

          <div class="info-grid">
            <div class="info-box">
              <span>Customer</span>
              <strong>${escapeHtml(item.customer_display_name || "Customer")}</strong>
              <div class="muted">${escapeHtml(item.customer_display_phone || "No phone")}</div>
              ${item.customer_display_phone ? `<a class="btn btn-sm btn-outline-dark mt-2" href="tel:${escapeHtml(item.customer_display_phone)}">Call Customer</a>` : ""}
            </div>
            <div class="info-box">
              <span>Payment</span>
              <strong>${String(item.payment_method || "cod").toUpperCase()}</strong>
              <div class="muted">${escapeHtml(item.payment_status || "to_collect")} | ${money(item.total_price)}</div>
            </div>
          </div>

          <div class="info-box">
            <span>Delivery Address</span>
            <strong>${escapeHtml(item.delivery_display_address || "No address")}</strong>
            ${item.delivery_note ? `<div class="muted mt-1">Note: ${escapeHtml(item.delivery_note)}</div>` : ""}
            ${item.failed_reason ? `<div class="muted mt-1">Last issue: ${escapeHtml(item.failed_reason)}</div>` : ""}
          </div>

          <div class="item-list">${itemRows(item)}</div>
          ${actionButtons(item)}
        </article>
      `).join("");
    }

    async function loadAssignments() {
      if (!guardRider()) return;
      const message = document.getElementById("message");
      message.className = "loading";
      message.innerText = "Loading deliveries...";
      try {
        const res = await fetch(`/rider/assignments?${actorQueryString()}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Unable to load rider deliveries.");
        assignments = Array.isArray(data.items) ? data.items : [];
        summary = data.summary || {};
        renderAssignments();
      } catch (error) {
        assignments = [];
        summary = {};
        renderSummary();
        document.getElementById("deliveryGrid").innerHTML = "";
        message.className = "empty-state";
        message.innerText = error.message || "Unable to load rider deliveries.";
      }
    }

    async function updateDeliveryStatus(id, status) {
      const label = statusLabel(status);
      const promptText = status === "failed_attempt" ? "Reason for failed delivery attempt" : `Note for ${label}`;
      const note = prompt(promptText, status === "delivered" ? "Delivered to customer" : "");
      if (note === null) return;

      const res = await fetch(`/rider/assignments/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, note, ...actorPayload() })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message || "Unable to update delivery status.");
      await loadAssignments();
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "/auth.html?returnTo=/rider/dashboard.html";
    }

    document.addEventListener("DOMContentLoaded", loadAssignments);
  </script>
</body>
</html>
