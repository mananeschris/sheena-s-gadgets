<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard | Sheena's Gadgets & Accessories Shop</title>
  <link rel="icon" type="image/svg+xml" href="/assets/sheena-mark.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #050505;
      --white: #ffffff;
      --muted: #666666;
      --line: #dddddd;
      --soft: #f6f6f6;
      --dark-soft: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .shell {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.72)),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.12), transparent 32%);
      padding: 20px;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 18px;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand span {
      display: block;
      color: #bdbdbd;
      font-size: 0.82rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      font-size: clamp(1.4rem, 4vw, 2.35rem);
      line-height: 1.05;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-light,
    .btn-outline-light {
      border-radius: 8px;
      font-weight: 700;
    }

    .dashboard {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .summary-card {
      padding: 18px;
      border-right: 1px solid var(--line);
      min-height: 92px;
    }

    .summary-card:last-child {
      border-right: 0;
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .summary-card strong {
      display: block;
      font-size: 1.7rem;
      line-height: 1;
    }

    .filters {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 10px;
      background: var(--soft);
    }

    .form-control,
    .form-select {
      border-radius: 8px;
      border-color: #cfcfcf;
      min-height: 44px;
    }

    .content {
      padding: 16px;
    }

    .delivery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .delivery-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--white);
    }

    .delivery-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .order-id {
      display: block;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--ink);
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-assigned {
      background: var(--white);
      color: var(--ink);
    }

    .status-progress {
      background: var(--ink);
      color: var(--white);
    }

    .status-done {
      background: #e9e9e9;
      color: var(--ink);
    }

    .status-issue {
      background: var(--dark-soft);
      color: var(--white);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .info-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--soft);
      min-height: 86px;
    }

    .info-box span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 4px;
    }

    .info-box strong {
      display: block;
      line-height: 1.25;
    }

    .item-list {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .item-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }

    .item-row img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status-actions .btn {
      border-radius: 8px;
      font-weight: 800;
    }

    .empty-state {
      border: 1px dashed #bdbdbd;
      border-radius: 8px;
      padding: 26px;
      text-align: center;
      background: var(--soft);
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
      padding: 30px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .shell {
        padding: 12px;
      }

      .summary,
      .delivery-grid,
      .info-grid,
      .filters {
        grid-template-columns: 1fr;
      }

      .summary-card {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-card:last-child {
        border-bottom: 0;
      }

      .delivery-head {
        display: grid;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }
  </style>
<link rel="stylesheet" href="/css/main.css?v=main-20260911b">
<link rel="stylesheet" href="/css/system-fonts.css?v=font-1">
<link rel="stylesheet" href="/css/rider-workspace.css?v=3">
<link rel="stylesheet" href="/css/delivery-proof.css?v=4">
</head>
<body class="rider-dashboard-page">
  <header class="topbar">
    <div class="rider-header-inner">
      <div class="rider-brand-area">
        <a class="rider-shop-brand" href="/rider/dashboard.html" aria-label="Sheena's Gadgets & Accessories Shop">
          <img class="brand-logo" src="/assets/sheena-mark.svg" alt="">
          <span class="rider-brand-copy"><strong>Sheena's</strong><span>Gadgets & Accessories Shop</span></span>
        </a>
        <div class="rider-page-context"><i data-lucide="truck" aria-hidden="true"></i><strong>Rider Dashboard</strong></div>
      </div>
      <div class="rider-header-tools">
        <div class="rider-account" aria-label="Rider account">
          <span id="riderAvatar" class="rider-avatar" aria-hidden="true">R</span>
          <div class="rider-account-copy"><strong id="riderNameText">Loading rider account...</strong><span>Delivery rider</span></div>
        </div>
        <div class="actions" role="group" aria-label="Rider actions">
          <button class="btn btn-outline-light" onclick="loadAssignments()" aria-label="Refresh deliveries" title="Refresh deliveries"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
          <button class="btn btn-light" onclick="logout()" aria-label="Log out" title="Log out"><i data-lucide="log-out" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <main class="dashboard">
      <section class="summary" aria-label="Delivery totals">
        <div class="summary-card"><i data-lucide="layers" aria-hidden="true"></i><span>Active</span><strong id="summaryActive">0</strong></div>
        <div class="summary-card"><i data-lucide="clipboard-list" aria-hidden="true"></i><span>Assigned</span><strong id="summaryAssigned">0</strong></div>
        <div class="summary-card"><i data-lucide="package-check" aria-hidden="true"></i><span>Picked Up</span><strong id="summaryPickedUp">0</strong></div>
        <div class="summary-card"><i data-lucide="truck" aria-hidden="true"></i><span>Out for Delivery</span><strong id="summaryOut">0</strong></div>
        <div class="summary-card"><i data-lucide="circle-check" aria-hidden="true"></i><span>Delivered Today</span><strong id="summaryDeliveredToday">0</strong></div>
      </section>

      <div class="deliveries-heading"><h1>My Deliveries</h1><span id="deliveryCount" aria-live="polite"></span></div>
      <section class="filters">
        <div class="rider-search"><i data-lucide="search" aria-hidden="true"></i><input id="deliverySearch" type="search" class="form-control" aria-label="Search deliveries" placeholder="Search deliveries..." oninput="renderAssignments()"></div>
        <div class="rider-status-filter"><i data-lucide="list-filter" aria-hidden="true"></i><select id="deliveryStatusFilter" class="form-select" aria-label="Delivery status" onchange="renderAssignments()">
          <option value="active">Active deliveries</option>
          <option value="all">All deliveries</option>
          <option value="assigned">Assigned</option>
          <option value="picked_up">Picked Up</option>
          <option value="out_for_delivery">Out for Delivery</option>
          <option value="failed_attempt">Failed Attempt</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select></div>
      </section>

      <section class="content">
        <div id="message" class="loading">Loading deliveries...</div>
        <div id="deliveryGrid" class="delivery-grid"></div>
      </section>
    </main>
  </div>

  <script src="/js/order-reference.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/delivery-chat.js?v=2"></script>
  <script src="/js/rider-delivery-proof.js?v=4"></script>
  <script>
    const DELIVERY_LABELS = {
      assigned: "Assigned",
      picked_up: "Picked Up",
      out_for_delivery: "Out for Delivery",
      delivered: "Delivered",
      failed_attempt: "Failed Attempt",
      cancelled: "Cancelled"
    };
    const ACTIVE_STATUSES = ["assigned", "picked_up", "out_for_delivery", "failed_attempt"];
    const TRANSITIONS = {
      assigned: [["picked_up", "Picked Up"], ["out_for_delivery", "Out for Delivery"], ["failed_attempt", "Failed Attempt"]],
      picked_up: [["out_for_delivery", "Out for Delivery"], ["delivered", "Delivered"], ["failed_attempt", "Failed Attempt"]],
      out_for_delivery: [["delivered", "Delivered"], ["failed_attempt", "Failed Attempt"]],
      failed_attempt: [["out_for_delivery", "Retry Delivery"]],
      delivered: [],
      cancelled: []
    };

    let currentUser = null;
    let assignments = [];
    let summary = {};

    function readUser() {
      try {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      } catch (error) {
        return null;
      }
    }

    function guardRider() {
      currentUser = readUser();
      if (!currentUser || String(currentUser.role || "").toLowerCase() !== "rider") {
        window.location.href = "/auth.html?returnTo=/rider/dashboard.html";
        return false;
      }
      const riderName = String(currentUser.name || currentUser.email || "Rider").trim() || "Rider";
      document.getElementById("riderNameText").textContent = riderName;
      document.getElementById("riderAvatar").textContent = riderName.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
      return true;
    }

    function actorPayload() {
      return {
        actor_id: currentUser?.id || null,
        actor_name: currentUser?.name || currentUser?.email || "Rider",
        actor_role: "rider"
      };
    }

    function actorQueryString() {
      return new URLSearchParams(actorPayload()).toString();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function money(value) {
      return "₱" + Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function statusLabel(status) {
      return DELIVERY_LABELS[status] || status || "Assigned";
    }

    function statusClass(status) {
      if (status === "delivered") return "status-done";
      if (status === "failed_attempt" || status === "cancelled") return "status-issue";
      if (status === "picked_up" || status === "out_for_delivery") return "status-progress";
      return "status-assigned";
    }

    function statusIcon(status) {
      return { assigned: "clipboard-list", picked_up: "package-check", out_for_delivery: "truck", delivered: "circle-check", failed_attempt: "triangle-alert", cancelled: "circle-x" }[status] || "package";
    }

    function paymentMethodLabel(method) {
      const value = String(method || "cod").toLowerCase();
      if (value === "gcash" || (value && !["cod", "cash", "installment", "manual", "pos"].includes(value))) return "GCash";
      if (value === "cod") return "Cash on Delivery";
      if (value === "cash") return "Cash";
      if (value === "installment") return "Installment";
      return String(method || "").toUpperCase();
    }

    function productImage(item) {
      return item?.product_image || "";
    }

    function assignmentSearchText(item) {
      const products = Array.isArray(item.items) ? item.items.map(product => `${product.product_name || ""} ${product.variant_name || ""}`).join(" ") : "";
      return [
        orderReference(item.order_id),
        item.customer_display_name,
        item.customer_display_phone,
        item.delivery_display_address,
        item.delivery_note,
        products
      ].join(" ").toLowerCase();
    }

    function filteredAssignments() {
      const search = document.getElementById("deliverySearch").value.toLowerCase();
      const status = document.getElementById("deliveryStatusFilter").value;
      return assignments.filter(item => {
        const matchesStatus = status === "all" ||
          (status === "active" && ACTIVE_STATUSES.includes(item.status)) ||
          item.status === status;
        return matchesStatus && assignmentSearchText(item).includes(search);
      });
    }

    function renderSummary() {
      const fallback = {
        active_count: assignments.filter(item => ACTIVE_STATUSES.includes(item.status)).length,
        assigned_count: assignments.filter(item => item.status === "assigned").length,
        picked_up_count: assignments.filter(item => item.status === "picked_up").length,
        out_for_delivery_count: assignments.filter(item => item.status === "out_for_delivery").length,
        delivered_today_count: assignments.filter(item => item.status === "delivered" && String(item.delivered_at || "").slice(0, 10) === new Date().toISOString().slice(0, 10)).length
      };
      const data = { ...fallback, ...summary };
      document.getElementById("summaryActive").innerText = data.active_count || 0;
      document.getElementById("summaryAssigned").innerText = data.assigned_count || 0;
      document.getElementById("summaryPickedUp").innerText = data.picked_up_count || 0;
      document.getElementById("summaryOut").innerText = data.out_for_delivery_count || 0;
      document.getElementById("summaryDeliveredToday").innerText = data.delivered_today_count || 0;
    }

    function itemRows(item) {
      const items = Array.isArray(item.items) && item.items.length ? item.items : [{
        product_name: item.product_name || "Product",
        variant_name: item.variant_name || "Default",
        quantity: item.quantity || 1,
        product_image: item.product_image
      }];

      return items.map(product => `
        <div class="item-row">
          <div class="rider-product-photo"><i data-lucide="package" aria-hidden="true"></i>${productImage(product) ? `<img src="${escapeHtml(productImage(product))}" alt="${escapeHtml(product.product_name || "Product")}" onerror="this.hidden=true">` : ""}</div>
          <div>
            <strong>${escapeHtml(product.product_name || "Product")}</strong>
            <div class="muted">${escapeHtml(product.variant_name || "Default")} <span class="item-quantity">Qty ${escapeHtml(product.quantity || 1)}</span></div>
          </div>
        </div>
      `).join("");
    }

    function actionButtons(item) {
      const options = TRANSITIONS[item.status] || [];
      if (!options.length) return `<div class="delivery-finished"><i data-lucide="${statusIcon(item.status)}" aria-hidden="true"></i>${item.status === "delivered" ? "Delivery completed" : item.status === "cancelled" ? "Delivery cancelled" : "No rider action needed."}</div>`;
      return `
        <div class="status-actions">
          ${options.map(([status, label], index) => `<button class="btn ${index === 0 ? "btn-dark" : "btn-outline-dark"} btn-sm" onclick="updateDeliveryStatus(${Number(item.id)}, '${status}')"><i data-lucide="${statusIcon(status)}" aria-hidden="true"></i>${label}</button>`).join("")}
        </div>
      `;
    }

    function renderAssignments() {
      renderSummary();
      const grid = document.getElementById("deliveryGrid");
      const message = document.getElementById("message");
      const rows = filteredAssignments();
      document.getElementById("deliveryCount").textContent = `${rows.length} ${rows.length === 1 ? "delivery" : "deliveries"}`;
      if (!rows.length) {
        grid.innerHTML = "";
        message.className = "empty-state";
        message.innerHTML = `<i data-lucide="${assignments.length ? "search-x" : "package-open"}" aria-hidden="true"></i><strong>${assignments.length ? "No deliveries match your filters." : "No delivery assignments yet."}</strong>${assignments.length ? '<button type="button" class="btn btn-outline-dark btn-sm" onclick="resetDeliveryFilters()"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Reset Filters</button>' : ""}`;
        window.lucide?.createIcons();
        return;
      }

      message.className = "d-none";
      grid.innerHTML = rows.map(item => `
        <article class="delivery-card" data-assignment="${Number(item.id)}">
          <div class="delivery-head">
            <div>
              <span class="order-id"><i data-lucide="package" aria-hidden="true"></i>Order ${escapeHtml(orderReference(item.order_id))}</span>
              <div class="assigned-date"><i data-lucide="clock-3" aria-hidden="true"></i>${escapeHtml(formatDate(item.assigned_at))}</div>
            </div>
            <span class="status-badge ${statusClass(item.status)}"><i data-lucide="${statusIcon(item.status)}" aria-hidden="true"></i>${escapeHtml(statusLabel(item.status))}</span>
          </div>

          <div class="item-list">${itemRows(item)}</div>

          <div class="delivery-destination">
            <i data-lucide="map-pin" aria-hidden="true"></i>
            <div><span class="detail-label">Delivery Address</span>
              <strong>${escapeHtml(item.delivery_display_address || "No address")}</strong>
              ${item.delivery_landmark ? `<div class="muted">Landmark: ${escapeHtml(item.delivery_landmark)}</div>` : ""}
              ${item.delivery_note ? `<div class="delivery-note"><i data-lucide="sticky-note" aria-hidden="true"></i>${escapeHtml(item.delivery_note)}</div>` : ""}
            </div>
            ${item.delivery_latitude != null && item.delivery_latitude !== "" && item.delivery_longitude != null && item.delivery_longitude !== "" && Number.isFinite(Number(item.delivery_latitude)) && Number.isFinite(Number(item.delivery_longitude)) ? `<a class="rider-icon-button" aria-label="Open Directions" title="Open Directions" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${item.delivery_latitude},${item.delivery_longitude}`)}" target="_blank" rel="noopener"><i data-lucide="navigation" aria-hidden="true"></i></a>` : ""}
          </div>

          <div class="delivery-contact">
            <i data-lucide="user-round" aria-hidden="true"></i>
            <div class="customer-info"><strong>${escapeHtml(item.customer_display_name || "Customer")}</strong><span>${escapeHtml(item.customer_display_phone || "No phone number")}</span></div>
            <div class="contact-actions">
              ${item.customer_display_phone ? `<a class="rider-icon-button" aria-label="Call Customer" title="Call Customer" href="tel:${escapeHtml(item.customer_display_phone)}"><i data-lucide="phone" aria-hidden="true"></i></a>` : ""}
              <button type="button" class="btn btn-sm btn-outline-dark" data-chat-assignment="${Number(item.id)}"><i data-lucide="message-circle" aria-hidden="true"></i>Chat Customer</button>
            </div>
          </div>

          <div class="delivery-payment">
            <i data-lucide="wallet" aria-hidden="true"></i>
            <div><strong>${escapeHtml(paymentMethodLabel(item.payment_method))}</strong><span>${escapeHtml(String(item.payment_status || "to_collect").replace(/_/g, " "))}</span></div>
            <div class="delivery-total"><span>Order total</span><strong>${money(item.total_price)}</strong></div>
          </div>
          ${item.failed_reason ? `<div class="delivery-issue"><i data-lucide="triangle-alert" aria-hidden="true"></i><div><strong>Last delivery issue</strong><span>${escapeHtml(item.failed_reason)}</span></div></div>` : ""}
          ${actionButtons(item)}
        </article>
      `).join("");
      window.lucide?.createIcons();
    }

    function resetDeliveryFilters() {
      document.getElementById("deliverySearch").value = "";
      document.getElementById("deliveryStatusFilter").value = "active";
      renderAssignments();
    }

    async function loadAssignments() {
      if (!guardRider()) return;
      const message = document.getElementById("message");
      message.className = "loading";
      message.innerText = "Loading deliveries...";
      try {
        const res = await fetch(`/rider/assignments?${actorQueryString()}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Unable to load rider deliveries.");
        assignments = Array.isArray(data.items) ? data.items : [];
        summary = data.summary || {};
        renderAssignments();
      } catch (error) {
        assignments = [];
        summary = {};
        renderSummary();
        document.getElementById("deliveryCount").textContent = "";
        document.getElementById("deliveryGrid").innerHTML = "";
        message.className = "empty-state";
        message.innerHTML = `<i data-lucide="wifi-off" aria-hidden="true"></i><strong>${escapeHtml(error.message || "Unable to load rider deliveries.")}</strong><button type="button" class="btn btn-outline-dark btn-sm" onclick="loadAssignments()"><i data-lucide="refresh-cw" aria-hidden="true"></i>Try Again</button>`;
        window.lucide?.createIcons();
      }
    }

    async function updateDeliveryStatus(id, status) {
      if (status === "delivered") return window.DeliveryProofRider.open(id, assignments.find(item => Number(item.id) === Number(id)));
      const label = statusLabel(status);
      const promptText = status === "failed_attempt" ? "Reason for failed delivery attempt" : `Note for ${label}`;
      const note = ["picked_up", "out_for_delivery"].includes(status) ? "" : prompt(promptText, status === "delivered" ? "Delivered to customer" : "");
      if (note === null) return;

      const res = await fetch(`/rider/assignments/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, note, ...actorPayload() })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message || "Unable to update delivery status.");
      await loadAssignments();
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "/auth.html?returnTo=/rider/dashboard.html";
    }

    document.addEventListener("DOMContentLoaded", loadAssignments);
  </script>
</body>
</html>
